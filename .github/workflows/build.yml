name: build
on: [push, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxkbcommon-dev
      - run: cargo build --release && cargo test --release
      - uses: actions/upload-artifact@v4
        with: { name: cybervpn-linux-x86_64, path: target/release/cybervpn }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with: { name: cybervpn-windows-x86_64, path: target/release/cybervpn.exe }
