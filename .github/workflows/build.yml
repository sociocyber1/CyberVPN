name: build
on:
  push:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - run: cargo build --release && cargo test --release
      - uses: actions/upload-artifact@v4
        with: { name: cybervpn-linux-x86_64, path: target/release/cybervpn }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with: { name: cybervpn-windows-x86_64, path: target/release/cybervpn.exe }
      # on a published release: attach the Windows build to it
      - if: github.event_name == 'release'
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp target/release/cybervpn.exe cybervpn-windows-x86_64.exe
          sha256sum cybervpn-windows-x86_64.exe > cybervpn-windows-x86_64.exe.sha256
          gh release upload "${{ github.event.release.tag_name }}" cybervpn-windows-x86_64.exe cybervpn-windows-x86_64.exe.sha256 --clobber
